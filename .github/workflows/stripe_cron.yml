name: Stripe Automated Task

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-stripe-process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install stripe

      - name: Execute Stripe Automation
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          python -c "
          import os, stripe
          stripe.api_key = os.environ.get('STRIPE_SECRET_KEY')
          print('Stripe Authentication Successful!')
          "

