name: Run Stripe Automation

on:
  workflow_dispatch: # يتيح لك تشغيل السكربت يدوياً من زر في موقع GitHub في أي وقت
  schedule:
    - cron: '0 0 * * *' # يمكنك جعله يعمل تلقائياً كل يوم (اختياري)

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install stripe

      - name: Run automation script
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
        run: python stripe_automation.py
